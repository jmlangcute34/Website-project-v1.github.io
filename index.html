<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cybersecurity and Data Protection in the Workplace</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf1f9;--ink:#0b2a4a;--muted:#5a6676;--card:#fff;--accent:#0b7fa8;--hero1:#0d2340;--hero2:#1d3e63;--ring:#1ea0ff;--shadow:0 6px 22px rgba(20,50,90,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1724;--ink:#e6eefb;--muted:#9fb0c6;--card:#16243a;--accent:#4cc3ee;--shadow:0 6px 22px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1724;--ink:#e6eefb;--muted:#9fb0c6;--card:#16243a;--accent:#4cc3ee;--shadow:0 6px 22px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,Arial,sans-serif}
.hero{background:linear-gradient(160deg,var(--hero1),var(--hero2));color:#fff;text-align:center;padding:56px 22px 64px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,rgba(255,255,255,.035) 0 2px,transparent 2px 46px)}
.hero>*{position:relative}
.hero h1{font-size:2rem;line-height:1.2;margin:0 0 16px;font-weight:700}
.hero p{font-size:1.2rem;line-height:1.6;margin:0 auto 38px;max-width:30em;font-weight:400}
.ring{width:224px;height:224px;margin:0 auto;border-radius:50%;border:8px solid var(--ring);display:grid;place-items:center;background:rgba(13,35,64,.55);box-shadow:0 0 28px rgba(30,160,255,.55),inset 0 0 22px rgba(30,160,255,.25);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 44px rgba(30,160,255,.8),inset 0 0 28px rgba(30,160,255,.35)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
.topics{max-width:640px;margin:0 auto;padding:56px 24px 64px}
.topics h2{text-align:center;font-size:2.2rem;margin:0 0 10px;font-weight:700}
.sub{text-align:center;color:var(--muted);font-size:1.15rem;line-height:1.35;margin:0 auto 38px;max-width:20em}
.card{display:block;width:100%;text-align:left;border:0;padding:0;margin:0 0 28px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;font:inherit;color:inherit;transition:transform .15s}
.card:active{transform:scale(.985)}
.card:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.card svg{display:block;width:100%;height:auto}
.card .t{padding:24px 30px 30px}
.card h3{margin:0 0 14px;font-size:1.6rem;color:var(--accent);font-weight:700}
.card p{margin:0;font-size:1.2rem;line-height:1.5;color:var(--muted)}
footer{background:#0d2340;color:#fff;text-align:center;padding:52px 22px 44px;font-size:1.3rem;position:relative;overflow:hidden;line-height:1.3}
